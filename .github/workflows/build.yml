name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'release tag, e.g. v0.7.5.1'
        required: true
      publish:
        description: 'create a GitHub release'
        type: boolean
        default: false
      torch_version:
        description: 'torch version to build with (cpu wheel)'
        required: false
        default: '2.7.1'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${{ inputs.torch_version }}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build binaries
        run: pyinstaller --clean --noconfirm klarity.spec
      - name: Diagnose torch bundle (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pip install -q pefile
          @'
          import pathlib
          import pefile
          bundle = pathlib.Path('dist/klarity/_internal')
          names = {p.name.lower() for p in bundle.rglob('*') if p.suffix.lower() == '.dll'}
          pe = pefile.PE(str(bundle / 'torch/lib/c10.dll'), fast_load=True)
          pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_IMPORT']])
          for entry in getattr(pe, 'DIRECTORY_ENTRY_IMPORT', []):
              name = entry.dll.decode()
              if name.lower() in names:
                  where = 'BUNDLE'
              elif pathlib.Path('C:/Windows/System32', name).exists():
                  where = 'SYSTEM'
              else:
                  where = 'MISSING'
              print(f'{where:8s} {name}')
          '@ | python -
          python -c "import pathlib; fs = list(pathlib.Path('dist/klarity/_internal/torch/lib').glob('*.dll')); print('torch/lib files:', len(fs))"
      - name: Smoke test CLI (linux)
        if: matrix.platform == 'linux'
        run: |
          ./dist/klarity/klarity --help > /dev/null
          ./dist/klarity/klarity info | grep -q "PyTorch"
      - name: Smoke test CLI (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & .\dist\klarity\klarity.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = & .\dist\klarity\klarity.exe info
          if (-not (($out | Out-String) -match 'PyTorch')) { exit 1 }
      - name: Package (linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p stage/klarity/models
          cp -r dist/klarity/. stage/klarity/
          cp packaging/linux/cli.sh stage/klarity/
          cp packaging/linux/install.sh stage/klarity/
          chmod +x stage/klarity/cli.sh stage/klarity/install.sh stage/klarity/klarity
          tar -czf klarity-cpu-linux_${{ inputs.version }}.tar.gz -C stage klarity
      - name: Package (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage/klarity/models | Out-Null
          Copy-Item dist/klarity/* stage/klarity/ -Recurse -Force
          Copy-Item packaging/windows/*.bat stage/klarity/
          Compress-Archive -Path stage/klarity -DestinationPath "klarity-cpu-windows_${{ inputs.version }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: klarity-cpu-${{ matrix.platform }}
          path: klarity-cpu-*
      - name: Create release
        if: inputs.publish == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" --title "Klarity ${{ inputs.version }}" --notes "CPU-only builds for Linux and Windows. See CHANGELOG.md for details."
          gh release upload "${{ inputs.version }}" klarity-cpu-* --repo "$GITHUB_REPOSITORY" --clobber
