name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'release tag, e.g. v0.7.5.1'
        required: true
      publish:
        description: 'create a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build binaries
        run: pyinstaller --clean --noconfirm klarity.spec
      - name: Smoke test CLI (linux)
        if: matrix.platform == 'linux'
        run: |
          ./dist/klarity/klarity --help > /dev/null
          ./dist/klarity/klarity info | grep -q "PyTorch"
      - name: Smoke test CLI (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & .\dist\klarity\klarity.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = & .\dist\klarity\klarity.exe info
          if (-not (($out | Out-String) -match 'PyTorch')) { exit 1 }
      - name: Package (linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p stage/klarity/models
          cp -r dist/klarity/. stage/klarity/
          cp packaging/linux/cli.sh stage/klarity/
          cp packaging/linux/install.sh stage/klarity/
          cp src/logo.png stage/klarity/
          chmod +x stage/klarity/cli.sh stage/klarity/install.sh stage/klarity/klarity
          tar -czf klarity-cpu-linux_${{ inputs.version }}.tar.gz -C stage klarity
      - name: Package (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage/klarity/models | Out-Null
          Copy-Item dist/klarity/* stage/klarity/ -Recurse -Force
          Copy-Item packaging/windows/*.bat stage/klarity/
          Copy-Item src/logo.png stage/klarity/logo.png
          Copy-Item packaging/windows/logo.ico stage/klarity/logo.ico
          Compress-Archive -Path stage/klarity -DestinationPath "klarity-cpu-windows_${{ inputs.version }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: klarity-cpu-${{ matrix.platform }}
          path: klarity-cpu-*
      - name: Create release
        if: inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.version }}" klarity-cpu-* --title "Klarity ${{ inputs.version }}" --notes "CPU-only builds for Linux and Windows. See CHANGELOG.md for details."
